<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Faça o seu cadastro</title>
  </head>

  <body>
    <!-- AREA WRAPPER -->
    <div id="wrapper">

      <!-- AREA CONTAINER -->
      <div id="container-signup">
        <!-- AREA DIREITA -->
        <div class="column">
          <div class="login-painel">
            <div class="logo">
              <img class="logo-img"src="assets/logo.png" alt=logo do sujeitogram">
            </div>

            <div class="message">
              <span>Cadastre-se para ver fotos e videos dos seus amigos.</span>
            </div>

            <button class="cta-button">
              Entrar com Facebook
            </button>

            <div class="divisor-container">
              <div class="line"></div>
              <div class="divisor-tag">ou</div>
              <div class="line"></div>
            </div>

            <form>
              <input type="text" placeholder="Telefone, usuario ou email" name="username">
              <input type="password" placeholder="senha" name="password">

              <input type="submit" value="Entrar" >
            </form>

            <div class="info-box">
              <p>nao possui uma conta? <a href="#">Cadastre-se</a></p>
            </div>

            <div class="get-app-panel">
              Obtenha o aplicativo
              <div class="app-buttons">
                <a href="#">
                  <img src="assets/appstore.png" alt="baixe na app store">
                </a>
                <a href="#">
                  <img src="assets/googleplay.png" alt="baixe na google play">
                </a>
              </div>
            </div>
          </div>
        </div>
        <!-- FIM AREA DIREITA -->
      </div>
      <!-- FIM AREA CONTAINER -->

      <!-- RODAPE -->
      <footer>
        <div class="footer-inner">
          <a href="#">About us</a>
          <a href="#">Support</a>
          <a href="#">Blog</a>
          <a href="#">Press</a>
          <a href="#">API</a>
          <a href="#">Jobs</a>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Directory</a>
          <a href="#">Profiles</a>
          <a href="#">Hashtags</a>
          <a href="#">Language</a>
          <div class="text-small">@ 2022 Instagram</div>
        </div>
      </footer>

    </div>
  </body>
</html>
