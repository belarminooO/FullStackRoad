<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Carregando a fonte roboto para usar no projeto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>SignIn</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="wrapper">
      <div class="left-side">
        <div class="form-container">
          <h1>Minha conta</h1>
          <form>
            <div class="inputs">
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Digite seu email"
              />
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Digite sua senha"
              />
            </div>

            <input type="submit" name="submit" id="submit" value="Acessar" />

            <strong>Novo por aqui?</strong><a href="signup.html">Cadastre-se</a>
          </form>
        </div>
      </div>

      <div class="right-side">
        <div class="info">
          <img src="assets/info.png" alt="" />
          <h1>Leve sua carreira ao proximo nivel</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni at,
            minima repellat esse accusantium quae mollitia voluptatem illum
            corrupti in laudantium modi et iure hic expedita delectus neque
            beatae voluptatum.
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
