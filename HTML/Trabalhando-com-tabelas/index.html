<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalhando com tabelas</title>
</head>


<body>
  <!--
    Tabela e composta de linhas que sao compostas por celulas.
    > <caption></caption> Para indicar o nome da tabela.
    > <tr></tr> Sao linhas (rows).
    < <th></th> Define o cabeçalho de uma tabela.
    < <td></td> Colocar os dados dentro da tabela.

    NB: tr e th sempre vao dentro de tr
  -->

  <h1>Trabalhando com tabelas.</h1>
  <table>
    <caption>Tabelas de serviços</caption>
    <tr>
      <th>Ordem</th>
      <th>serviços</th>
      <th>Preço</th>
      <th>Status</th>
    </tr>

    <tr>
      <td>1</td>
      <td>Troca de vidro</td>
      <td>600</td>
      <td>em andamento</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Limpeza</td>
      <td>200</td>
      <td>aguardando</td>
    </tr>
  </table>

</body>
</html>
