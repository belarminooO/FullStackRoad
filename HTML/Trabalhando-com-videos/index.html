<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalhando com videos</title>
</head>

<body>

  <!--
    video<source

    tag source, propriedades:
    src - diretoria ate ao video.
    type - tipo.

    tag video, propriedades :
    poster="" - diretoria para a thumbnail do video.
    width="" - altura.
    height="" - largura.
    controls - para poder ter os controles de play, tela cheia etc.
    loop - para o video ficar em loop.
    muted - para que o video comece pre mutado.
    autoplay - para que o video comece automaticamente.
  -->

<h1>Trabalhando com videos</h1>
<video poster="thumb.png" width="420" height="340" controls loop>
  <source src="natureza.mp4" type="video/mp4">
</video>




</body>
</html>
