<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalhando com formularios</title>
</head>

<body>
  <!--
  <label></label>Serve para dar indicacao sobre o campo a preencher
  <input> campo no qual o user ira inserir algo...
    > por default - type="text"
      > type="submit" - Botao para submissao do formulario...
      > type="radio" - para 1 so escolha dentre muitas. (a propriedeade name="" dos varios inputs deve ser igual)
      > type="checkbox" - para varias escolhas dentre muitas.
      > type="email" - aplica validacoes basicas para verrificar se trata-se de um email ou nao...
      > type="datetime-local" - para recolher data e hora.
      > type="date" - para recolher a data.
    > placeholder="" - texto para dar dica no campo do input.
    > required - campo obrigatorio.

  NB : label tem a propriedade for="" que serve para referenciar o <input> ao qual ele esta associado.
  o input deve ter id="" e name="" identicos ao for="" da label.

  -->

  <h1>Formularios</h1>
  <form>

    <label for="email">Seu email</label>
    <input type="email" name="email" id="email"> <br> <br>

    <label for="pnome">Primeiro Nome</label>
    <input type="text" id="pnome" name="pnome" placeholder="Seu primeiro nome" required> <br> <br>

    <label for="unome">Ultimo nome</label>
    <input type="text" id="unome" name="unome" placeholder="Seu ultimo nome" required> <br> <br>

    <!-- Tipo RADRIO-->
     <label for="">
     <strong>Qual seu nivel como programador atualmente</strong>
     </label> <br>

     <label>
      <!-- checked - para deixar pre selecionado -->
        <input type="radio" name="nivel" value="iniciante" checked> Sou iniciante
     </label>
      <label>
        <input type="radio" name="nivel" value="medio"> Comecei a pouco tempo
      </label>
      <label>
        <input type="radio" name="nivel" value="avancado"> Sou avançado
      </label> <br> <br>

      <!-- Tipo Select para selecionar itens -->
      <label for="escolaridade">
        <strong>Sua escolaridade</strong>
      </label>
      <select id="escolaridade" required>
        <!--
        selected - para deixar pre selecionado.
        disabled - para desativar a selecao dessa opcao
          -->
        <option selected disabled value="">Selecione</option>
        <option>Educacao basica</option>
        <option>Ensino medio</option>
        <option>Ensino Superior</option>
        <option>Pos graduacao</option>
      </select> <br> <br>

      <!--Checkbox-->
      <label>
        <strong>Selecione as tecnologias que voce conhece.</strong>
      </label> <br> <br>

      <input type="checkbox" id="tecnologia1" name="tecnologia1" value="HTML">
      <label for="tecnologia1">HTML</label>

      <input type="checkbox" id="tecnologia2" name="tecnologia2" value="CSS">
      <label for="tecnologia2">CSS</label>

      <input type="checkbox" id="tecnologia3" name="tecnologia3" value="JavaScript">
      <label for="tecnologia3">JavaScript</label>

      <input type="checkbox" id="tecnologia4" name="tecnologia4" value="PHP">
      <label for="tecnologia4">PHP</label>

      <br> <br>

      <!--Tipo Date-->
      <label for="nascimento">Data de nascimento</label>
      <input type="datetime-local" name="nascimento" id="nascimento">

    <br><br>
    <input type="submit" value="Cadastrar">
  </form>

</body>
</html>
