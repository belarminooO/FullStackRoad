<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalhando com listas</title>
</head>

<body>

  <!--
    dentro da tag da lista (ol / ul):
     type="" para indicar o estilo dos bullets
     start="" para indicar o inicio
  -->

  <!--
    lista ordenada (order list - ol)
  -->
  <h1>Lista ordenada</h1>
  <ol start="5">
    <li>Estudar & Estudar</li>
    <li>Configurar ambiente</li>
    <li>Aprender HTML</li>
    <li>Estudar CSS</li>
  </ol>

  <!--
    lista nao ordenada (unOrder list - ul)
  -->
  <h2>Lista nao ordenada</h2>
  <ul>
    <li>Configurar meu ambiente</li>
    <li>Prender Js</li>
    <li>Rever materia</li>
  </ul>

</body>
</html>
